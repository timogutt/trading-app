name: Daily portfolio report
on:
  # PAUSED: nightly schedule disabled. To re-enable, uncomment the 2 lines below.
  # schedule:
  #   - cron: "30 21 * * 1-5"   # 21:30 UTC, after the US close (adjust for your timezone)
  workflow_dispatch:
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python daily_report.py --send
        env:
          PORTFOLIO_JSON: ${{ secrets.PORTFOLIO_JSON }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || secrets.GMAIL }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || secrets.PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER || secrets.EMAIL }}
          SMTP_PASS: ${{ secrets.SMTP_PASS || secrets.PASS }}
          REPORT_TO: ${{ secrets.REPORT_TO || secrets.RECIEVER || secrets.EMAIL }}
